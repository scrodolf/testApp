name: food_tracker
description: A foundational offline-first Food Tracker app.
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.1.4
  flutter_riverpod: ^2.5.1
  drift: ^2.14.1
  path_provider: ^2.1.2
  sqlite3_flutter_libs: ^0.5.20
  shared_preferences: ^2.2.2
  table_calendar: ^3.0.9
  fl_chart: ^1.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_lints: ^3.0.0
  drift_dev: ^2.14.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  generate: true
